# ACME 전용 블록.
#
# 수신기 자체는 4443 에서 mTLS 를 직접 종단하므로 이 블록으로 프록시하지
# 않는다 — Tesla 문서가 금지하는 바로 그 구성이 된다. 여기 80 포트는
# Let's Encrypt 갱신이 도달할 곳이 필요해서만 존재한다.
server {
    listen 80;
    server_name telemetry.teslam.io;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-telemetry;
    }

    location / {
        return 404;
    }
}
